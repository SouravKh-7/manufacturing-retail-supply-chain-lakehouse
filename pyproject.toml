[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manufacturing-retail-supply-chain-lakehouse"
version = "0.1.0"
description = "Contracts and scaffold for a manufacturing and retail supply-chain lakehouse."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/generators", "src/quality", "src/reconciliation", "src/utilities"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

